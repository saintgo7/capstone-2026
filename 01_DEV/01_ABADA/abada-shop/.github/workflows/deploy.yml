name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/saas-abada-shop-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/saas-abada-shop-web

jobs:
  # ─────────────────────────────────────────
  # Lint: ESLint + TypeScript type check
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (API)
        run: npm install
        working-directory: apps/api

      - name: Install dependencies (Web)
        run: npm install
        working-directory: apps/web

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: TypeScript type check (API)
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: ESLint (Web)
        run: npm run lint
        working-directory: apps/web

  # ─────────────────────────────────────────
  # Test: API unit tests (vitest)
  # ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (API)
        run: npm install
        working-directory: apps/api

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Run API tests
        run: npm run test
        working-directory: apps/api

  # ─────────────────────────────────────────
  # Build: Docker images -> GHCR
  # ─────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://api:3000' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://shop.abada.kr' }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ─────────────────────────────────────────
  # Deploy: SSH to production server
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      packages: read
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            cd ~/abada-shop

            # Sync latest compose/nginx files from GitHub
            git init -q 2>/dev/null || true
            git -c user.email="deploy@github" -c user.name="deploy" \
              fetch -q https://oauth2:${GHCR_TOKEN}@github.com/saintgo7/saas-abada-shop.git main
            git checkout -f FETCH_HEAD -- docker-compose.yml docker-compose.prod.yml nginx/

            # Create .env symlink so docker-compose.yml (dev base) can find it
            [ -f .env ] || ln -sf .env.production .env

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull api web

            # Stop existing containers to avoid port conflicts on re-deploy
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml exec -T api npx prisma migrate deploy

            echo "Waiting for health check..."
            sleep 20

            for i in 1 2 3 4 5; do
              if docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml \
                exec -T api wget -qO- http://localhost:3001/health > /dev/null 2>&1; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done

            echo "=== API container logs ==="
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml logs api --tail=50
            echo "Health check failed after 5 attempts"
            exit 1
