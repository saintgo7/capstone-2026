name: PR Check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────
  # Lint: ESLint + TypeScript type check
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: TypeScript type check (API)
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: ESLint (Web)
        run: npm run lint
        working-directory: apps/web

  # ─────────────────────────────────────────
  # Test: API unit tests (vitest)
  # ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Run API tests
        run: npm run test
        working-directory: apps/api
