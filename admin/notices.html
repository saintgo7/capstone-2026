<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 관리 | 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="admin-header">
        <h1>공지사항 관리</h1>
        <button class="btn-primary" id="add-notice-btn">+ 공지사항 추가</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>제목</th>
              <th>카테고리</th>
              <th>고정</th>
              <th>작성일</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="notices-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="admin-modal-overlay" id="notice-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="modal-title">공지사항 추가</h2>
        <button class="admin-modal-close" id="modal-close">&times;</button>
      </div>
      <div class="admin-modal-body">
        <input type="hidden" id="notice-id">
        <div class="form-group">
          <label>제목 <span class="required">*</span></label>
          <input type="text" id="notice-title" maxlength="100" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>카테고리</label>
            <select id="notice-category">
              <option value="학사">학사</option>
              <option value="행사">행사</option>
              <option value="취업">취업</option>
              <option value="일반">일반</option>
            </select>
          </div>
          <div class="form-group">
            <label>상단 고정</label>
            <select id="notice-pinned">
              <option value="false">아니오</option>
              <option value="true">예</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>내용 <span class="required">*</span></label>
          <textarea id="notice-content" rows="8" maxlength="2000" required></textarea>
        </div>
      </div>
      <div class="admin-modal-footer">
        <button class="btn-secondary" id="modal-cancel">취소</button>
        <button class="btn-primary" id="modal-save">저장</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/render-utils.js"></script>
  <script>SeedData.initAll();</script>
  <script src="admin-common.js"></script>
  <script src="admin-notices.js"></script>
</body>
</html>
