<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교육과정 관리 | 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="admin-header">
        <h1>교육과정 관리</h1>
        <button class="btn-primary" id="add-course-btn">+ 과목 추가</button>
      </div>

      <div class="admin-tabs" id="year-tabs">
        <button class="admin-tab active" data-year="1">1학년</button>
        <button class="admin-tab" data-year="2">2학년</button>
        <button class="admin-tab" data-year="3">3학년</button>
        <button class="admin-tab" data-year="4">4학년</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>순서</th>
              <th>구분</th>
              <th>과목명</th>
              <th>학점</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="curriculum-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="admin-modal-overlay" id="course-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="modal-title">과목 추가</h2>
        <button class="admin-modal-close" id="modal-close">&times;</button>
      </div>
      <div class="admin-modal-body">
        <input type="hidden" id="course-id">
        <div class="form-group">
          <label>과목명 <span class="required">*</span></label>
          <input type="text" id="course-name" maxlength="100" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>학년</label>
            <select id="course-year">
              <option value="1">1학년</option>
              <option value="2">2학년</option>
              <option value="3">3학년</option>
              <option value="4">4학년</option>
            </select>
          </div>
          <div class="form-group">
            <label>구분</label>
            <select id="course-category">
              <option value="전공기초">전공기초</option>
              <option value="전공필수">전공필수</option>
              <option value="전공선택">전공선택</option>
              <option value="교양">교양</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>학점</label>
            <input type="number" id="course-credits" min="1" max="6" value="3">
          </div>
          <div class="form-group">
            <label>순서</label>
            <input type="number" id="course-order" min="1" value="1">
          </div>
        </div>
      </div>
      <div class="admin-modal-footer">
        <button class="btn-secondary" id="modal-cancel">취소</button>
        <button class="btn-primary" id="modal-save">저장</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/render-utils.js"></script>
  <script>SeedData.initAll();</script>
  <script src="admin-common.js"></script>
  <script src="admin-curriculum.js"></script>
</body>
</html>
