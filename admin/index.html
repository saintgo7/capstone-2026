<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 | 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="admin-header">
        <h1>대시보드</h1>
        <div class="header-actions">
          <button class="btn-secondary" id="export-btn">📥 데이터 내보내기</button>
          <label class="btn-secondary" style="cursor:pointer">
            📤 데이터 가져오기
            <input type="file" id="import-file" accept=".json" style="display:none">
          </label>
        </div>
      </div>

      <div class="dashboard-grid" id="dashboard-grid"></div>

      <div class="quick-links">
        <a href="notices.html" class="quick-link">
          <span class="link-icon">📋</span>
          <span class="link-text">공지사항 관리</span>
        </a>
        <a href="professors.html" class="quick-link">
          <span class="link-icon">👨‍🏫</span>
          <span class="link-text">교수진 관리</span>
        </a>
        <a href="curriculum.html" class="quick-link">
          <span class="link-icon">📚</span>
          <span class="link-text">교육과정 관리</span>
        </a>
        <a href="gallery.html" class="quick-link">
          <span class="link-icon">🖼️</span>
          <span class="link-text">갤러리 관리</span>
        </a>
      </div>

      <div class="storage-info" id="storage-info"></div>

      <div class="storage-info" style="margin-top:16px">
        <h3>🔒 비밀번호 변경</h3>
        <div class="form-group" style="margin-top:12px">
          <label>현재 비밀번호</label>
          <input type="password" id="current-pw" style="max-width:300px">
        </div>
        <div class="form-group">
          <label>새 비밀번호</label>
          <input type="password" id="new-pw" style="max-width:300px">
        </div>
        <div class="form-group">
          <label>새 비밀번호 확인</label>
          <input type="password" id="confirm-pw" style="max-width:300px">
        </div>
        <button class="btn-primary" id="change-pw-btn">비밀번호 변경</button>
      </div>
    </main>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/render-utils.js"></script>
  <script>SeedData.initAll();</script>
  <script src="admin-common.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
