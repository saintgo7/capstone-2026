<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갤러리 관리 | 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="admin-header">
        <h1>갤러리 관리</h1>
        <button class="btn-primary" id="add-gallery-btn">+ 사진 추가</button>
      </div>

      <div class="admin-gallery-grid" id="gallery-grid"></div>
    </main>
  </div>

  <div class="admin-modal-overlay" id="gallery-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="modal-title">사진 추가</h2>
        <button class="admin-modal-close" id="modal-close">&times;</button>
      </div>
      <div class="admin-modal-body">
        <input type="hidden" id="gallery-id">
        <div class="form-group">
          <label>제목 <span class="required">*</span></label>
          <input type="text" id="gallery-title" maxlength="100" required>
        </div>
        <div class="form-group">
          <label>설명</label>
          <textarea id="gallery-desc" rows="3" maxlength="500"></textarea>
        </div>
        <div class="form-group">
          <label>카테고리</label>
          <select id="gallery-category">
            <option value="행사">행사</option>
            <option value="시설">시설</option>
            <option value="수업">수업</option>
          </select>
        </div>
        <div class="form-group">
          <label>이미지 URL</label>
          <input type="text" id="gallery-url" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>또는 이미지 파일 업로드</label>
          <input type="file" id="gallery-file" accept="image/*">
          <img class="image-preview" id="image-preview">
        </div>
      </div>
      <div class="admin-modal-footer">
        <button class="btn-secondary" id="modal-cancel">취소</button>
        <button class="btn-primary" id="modal-save">저장</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/render-utils.js"></script>
  <script>SeedData.initAll();</script>
  <script src="admin-common.js"></script>
  <script src="admin-gallery.js"></script>
</body>
</html>
