<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교수진 관리 | 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="admin-header">
        <h1>교수진 관리</h1>
        <button class="btn-primary" id="add-prof-btn">+ 교수 추가</button>
      </div>

      <div class="admin-cards-grid" id="prof-grid"></div>
    </main>
  </div>

  <div class="admin-modal-overlay" id="prof-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="modal-title">교수 추가</h2>
        <button class="admin-modal-close" id="modal-close">&times;</button>
      </div>
      <div class="admin-modal-body">
        <input type="hidden" id="prof-id">
        <div class="form-group">
          <label>이름 <span class="required">*</span></label>
          <input type="text" id="prof-name" maxlength="50" required>
        </div>
        <div class="form-group">
          <label>전공 분야 <span class="required">*</span></label>
          <input type="text" id="prof-field" maxlength="100" required>
        </div>
        <div class="form-group">
          <label>소개 <span class="required">*</span></label>
          <textarea id="prof-desc" rows="3" maxlength="500" required></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>이메일</label>
            <input type="email" id="prof-email">
          </div>
          <div class="form-group">
            <label>순서</label>
            <input type="number" id="prof-order" min="1" value="1">
          </div>
        </div>
      </div>
      <div class="admin-modal-footer">
        <button class="btn-secondary" id="modal-cancel">취소</button>
        <button class="btn-primary" id="modal-save">저장</button>
      </div>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/render-utils.js"></script>
  <script>SeedData.initAll();</script>
  <script src="admin-common.js"></script>
  <script src="admin-professors.js"></script>
</body>
</html>
